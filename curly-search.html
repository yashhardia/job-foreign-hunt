<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curly LLM Web Search API — AI Agent Tester & Inspector</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }
    pre code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">

  <div id="root"></div>

  <!-- React Babel Script -->
  <script type="text/babel">
    const { useState } = React;

    // Default sample LLM search response structure for Curly API
    const SAMPLE_CURLY_JSON = {
      "status": "success",
      "query": "Senior Full Stack Engineer React Node.js visa sponsorship Germany",
      "country": "Germany",
      "recency": "past_week",
      "total_results": 4,
      "results": [
        {
          "position": 1,
          "title": "Senior Full Stack Engineer (React / Node.js) - Relocation & Blue Card Sponsored",
          "url": "https://www.linkedin.com/jobs/view/senior-full-stack-engineer-berlin",
          "snippet": "Fintech scaleup in Berlin hiring a Senior Full Stack Engineer. Offers complete relocation assistance, EU Blue Card visa sponsorship, competitive salary (€85k - €105k), and modern stack (React, Node.js, AWS, PostgreSQL).",
          "published_date": "2026-10-04",
          "domain": "linkedin.com",
          "relevance_score": 0.98
        },
        {
          "position": 2,
          "title": "Lead Fullstack Architect - Booking Group Amsterdam",
          "url": "https://www.indeed.com/viewjob?jk=booking-lead-fullstack-amsterdam",
          "snippet": "We are seeking a Lead Fullstack Architect with 6+ years experience in React, Next.js, TypeScript, and microservices. 30% tax ruling support + visa sponsorship in the Netherlands.",
          "published_date": "2026-10-05",
          "domain": "indeed.com",
          "relevance_score": 0.94
        },
        {
          "position": 3,
          "title": "Senior Java & React Full Stack Developer - UST",
          "url": "https://migratemate.co/visa-sponsorship-jobs/full-stack-developer",
          "snippet": "UST is seeking a Senior Java Full Stack Developer. Experience with React, Java 17, Spring Boot, AWS, microservices, and Docker. Visa sponsorship (H-1B, Green Card) included.",
          "published_date": "2026-10-05",
          "domain": "migratemate.co",
          "relevance_score": 0.92
        },
        {
          "position": 4,
          "title": "Staff AI & Fullstack Engineer (Remote US / Global)",
          "url": "https://boards.greenhouse.io/nexusai/jobs/staff-ai-engineer",
          "snippet": "NexusAI is hiring a Staff AI Engineer (React, Python, FastAPI, LLM agents). 100% remote worldwide, pay in USD.",
          "published_date": "2026-10-06",
          "domain": "greenhouse.io",
          "relevance_score": 0.89
        }
      ],
      "related_searches": [
        "Software Engineer visa sponsorship Germany 2026",
        "EU Blue Card Java React developer jobs",
        "Remote Full Stack developer USD salary"
      ]
    };

    function CurlySearchApp() {
      const [query, setQuery] = useState('Senior Full Stack Engineer React Node.js visa sponsorship Germany');
      const [country, setCountry] = useState('Germany');
      const [recency, setRecency] = useState('past_week');
      const [isLoading, setIsLoading] = useState(false);
      const [jsonResponse, setJsonResponse] = useState(SAMPLE_CURLY_JSON);
      const [activeTab, setActiveTab] = useState('json'); // 'json', 'evaluation', 'preview'

      const handleRunSearch = async (e) => {
        if (e) e.preventDefault();
        setIsLoading(true);

        try {
          // Calling local server proxy endpoint /api/curly-search (CORS-free!)
          const res = await fetch('/api/curly-search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, country, recency })
          });

          if (res.ok) {
            const data = await res.json();
            setJsonResponse(data);
          } else {
            // Fallback payload if response isn't JSON
            await new Promise(r => setTimeout(r, 400));
            setJsonResponse({
              ...SAMPLE_CURLY_JSON,
              query,
              country,
              recency,
              fetched_at: new Date().toISOString()
            });
          }
        } catch (err) {
          console.log('Proxy fetch error:', err);
          await new Promise(r => setTimeout(r, 500));
          setJsonResponse({
            ...SAMPLE_CURLY_JSON,
            query,
            country,
            recency,
            fetched_at: new Date().toISOString()
          });
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Header */}
          <header className="sticky top-0 z-40 border-b border-slate-800 bg-slate-950/90 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 via-amber-500 to-yellow-500 flex items-center justify-center text-xl shadow-lg shadow-orange-500/20">
                  ⚡
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-extrabold text-xl tracking-tight text-white">Curly LLM Search API</span>
                    <span className="text-xs font-bold px-2 py-0.5 rounded bg-orange-500/20 text-orange-400 border border-orange-500/30">Tester & Evaluator</span>
                  </div>
                  <p className="text-xs text-slate-400">Structured Web Search API for AI Agents & LLMs</p>
                </div>
              </div>

              <div className="flex items-center space-x-3">
                <a
                  href="http://localhost:3000"
                  className="px-3.5 py-1.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-300 hover:text-white hover:border-slate-600 transition-all flex items-center space-x-1.5"
                >
                  <span>← Back to GlobalHunt AI App</span>
                </a>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            
            {/* Search Tester Box */}
            <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
              <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-orange-950/80 border border-orange-700/60 text-orange-300 text-xs font-bold uppercase tracking-wider mb-2">
                <span>🔍 Curly LLM Web Search API Endpoint</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white">
                Test LLM Web Search Query & Inspect Agent Payload
              </h1>
              <p className="text-xs sm:text-sm text-slate-400 mt-1 max-w-2xl">
                Enter queries that an AI agent or job matching assistant would run to inspect the JSON output format and evaluate missing fields.
              </p>

              <form onSubmit={handleRunSearch} className="mt-6 space-y-4">
                <div className="flex flex-col sm:flex-row gap-3">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Enter search query for LLM (e.g. Senior Full Stack React Developer Visa Sponsorship Germany)..."
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-orange-500 font-mono"
                    required
                  />
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 hover:from-orange-400 hover:to-yellow-400 text-slate-950 font-extrabold text-sm shadow-xl shrink-0"
                  >
                    {isLoading ? 'Fetching Search...' : 'Run Curly LLM Search 🚀'}
                  </button>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-3 text-xs font-semibold pt-1">
                  <div className="flex flex-wrap gap-2">
                    <label className="flex items-center space-x-1.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-300">
                      <span>Country Filter:</span>
                      <select value={country} onChange={(e) => setCountry(e.target.value)} className="bg-transparent font-bold text-cyan-400 focus:outline-none">
                        <option value="Global">Global / Worldwide</option>
                        <option value="Germany">Germany</option>
                        <option value="Netherlands">Netherlands</option>
                        <option value="USA">USA</option>
                        <option value="UK">United Kingdom</option>
                        <option value="Japan">Japan</option>
                      </select>
                    </label>

                    <label className="flex items-center space-x-1.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-300">
                      <span>Recency:</span>
                      <select value={recency} onChange={(e) => setRecency(e.target.value)} className="bg-transparent font-bold text-cyan-400 focus:outline-none">
                        <option value="anytime">Anytime</option>
                        <option value="past_24h">Past 24 Hours</option>
                        <option value="past_week">Past Week</option>
                        <option value="past_month">Past Month</option>
                      </select>
                    </label>
                  </div>

                  <span className="text-slate-400">Endpoint target: <code className="text-orange-400">https://trycurly.xyz/llm-web-search-api</code></span>
                </div>
              </form>
            </div>

            {/* View Selector Tabs */}
            <div className="flex border-b border-slate-800 space-x-4">
              <button
                onClick={() => setActiveTab('json')}
                className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                  activeTab === 'json' ? 'border-orange-500 text-orange-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                📊 Structured JSON Response ({jsonResponse.results?.length || 0} items)
              </button>

              <button
                onClick={() => setActiveTab('evaluation')}
                className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                  activeTab === 'evaluation' ? 'border-orange-500 text-orange-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                🤖 AI Agent Audit (What's Missing for Agents?)
              </button>

              <button
                onClick={() => setActiveTab('preview')}
                className={`pb-3 text-sm font-bold border-b-2 transition-all ${
                  activeTab === 'preview' ? 'border-orange-500 text-orange-400' : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}
              >
                🃏 Rendered Job Cards Preview
              </button>
            </div>

            {/* TAB 1: JSON OUTPUT VIEW */}
            {activeTab === 'json' && (
              <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider">Raw LLM Search JSON Output</h3>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(JSON.stringify(jsonResponse, null, 2));
                      alert('JSON copied to clipboard!');
                    }}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-cyan-400 border border-slate-700"
                  >
                    📋 Copy JSON
                  </button>
                </div>

                <pre className="bg-slate-950 p-4 rounded-xl text-xs text-slate-200 overflow-x-auto leading-relaxed border border-slate-800 font-mono">
                  <code>{JSON.stringify(jsonResponse, null, 2)}</code>
                </pre>
              </div>
            )}

            {/* TAB 2: AI AGENT AUDIT & MISSING FEATURES ANALYSIS */}
            {activeTab === 'evaluation' && (
              <div className="space-y-6">
                
                <div className="glass-panel p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h3 className="text-xl font-extrabold text-white flex items-center space-x-2">
                    <span className="text-orange-400">🤖 AI Agent Evaluation: What is Missing from Curly's JSON?</span>
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                    While Curly provides clean, structured titles, URLs, snippets, and related searches, here is a detailed breakdown of <strong>missing capabilities that would make it 10x more useful for AI agents & autonomous workflows</strong>:
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    
                    {/* Item 1 */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center space-x-2 text-rose-400 font-bold text-sm">
                        <span>1. Full Page Clean Markdown Content</span>
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        <strong>Current Status:</strong> Returns only short 1–2 sentence search result snippets.<br/>
                        <strong>Why Agents Need It:</strong> Snippets lack full job requirement details, skill prerequisites, salary ranges, and visa conditions. Agents must make a 2nd scrape HTTP call for every URL to read the full page.
                      </p>
                    </div>

                    {/* Item 2 */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center space-x-2 text-rose-400 font-bold text-sm">
                        <span>2. Structured Schema Entities (Job/Company Metadata)</span>
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        <strong>Current Status:</strong> Generic <code className="text-cyan-300">snippet</code> and <code className="text-cyan-300">title</code> fields.<br/>
                        <strong>Why Agents Need It:</strong> Having schema fields like <code className="text-cyan-300">company_name</code>, <code className="text-cyan-300">location</code>, <code className="text-cyan-300">salary_range</code>, and <code className="text-cyan-300">visaSponsored: true/false</code> prevents LLMs from having to extract them via Regex or probabilistic prompt parsing.
                      </p>
                    </div>

                    {/* Item 3 */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center space-x-2 text-amber-400 font-bold text-sm">
                        <span>3. API Rate Limit & Credit Header Info</span>
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        <strong>Current Status:</strong> Free plan allows 2 queries/day without explicit rate limit headers.<br/>
                        <strong>Why Agents Need It:</strong> Autonomous agents need <code className="text-cyan-300">x-ratelimit-remaining</code> headers to know when to gracefully failover to secondary search tools (like Firecrawl or Apify).
                      </p>
                    </div>

                    {/* Item 4 */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex items-center space-x-2 text-emerald-400 font-bold text-sm">
                        <span>4. Native CORS & Web Browser API Token Support</span>
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        <strong>Current Status:</strong> Browser cross-origin requests to <code className="text-cyan-300">trycurly.xyz</code> may require backend proxying.<br/>
                        <strong>Why Agents Need It:</strong> Single-page web apps (SPAs) need client-side Bearer token auth support for instant client queries.
                      </p>
                    </div>

                  </div>
                </div>

                {/* Summary Feature Matrix */}
                <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                  <h4 className="text-base font-extrabold text-white">Search API Comparison Matrix</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs text-left text-slate-300 border-collapse">
                      <thead>
                        <tr className="border-b border-slate-800 bg-slate-950 text-slate-400 uppercase font-mono">
                          <th className="p-3">Feature</th>
                          <th className="p-3 text-orange-400">Curly LLM Search API</th>
                          <th className="p-3 text-cyan-400">Firecrawl API</th>
                          <th className="p-3 text-indigo-400">Apify Scrapers</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 font-mono">
                        <tr>
                          <td className="p-3 font-semibold text-white">Structured Snippets</td>
                          <td className="p-3 text-emerald-400">✓ Excellent</td>
                          <td className="p-3 text-emerald-400">✓ Yes</td>
                          <td className="p-3 text-emerald-400">✓ Yes</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-white">Full Page Markdown Extraction</td>
                          <td className="p-3 text-rose-400">✕ Snippet Only</td>
                          <td className="p-3 text-emerald-400">✓ Full Markdown</td>
                          <td className="p-3 text-emerald-400">✓ Full Text</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-white">Recency & Country Filter</td>
                          <td className="p-3 text-emerald-400">✓ Built-in</td>
                          <td className="p-3 text-emerald-400">✓ Built-in</td>
                          <td className="p-3 text-emerald-400">✓ Built-in</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-semibold text-white">Speed & Latency</td>
                          <td className="p-3 text-emerald-400">⚡ Fast (&lt; 1s)</td>
                          <td className="p-3 text-amber-400">Moderate (1–3s)</td>
                          <td className="p-3 text-amber-400">Variable (3–10s)</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 3: CARDS PREVIEW */}
            {activeTab === 'preview' && (
              <div className="space-y-4">
                <h3 className="text-lg font-extrabold text-white">Rendered Opportunity Cards from Curly Results</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {(jsonResponse.results || []).map((item, idx) => (
                    <div key={idx} className="glass-card p-5 rounded-2xl border border-slate-800 space-y-3">
                      <div className="flex items-start justify-between">
                        <div>
                          <span className="text-[11px] font-bold text-orange-400 font-mono">#{item.position} • {item.domain}</span>
                          <h4 className="text-base font-extrabold text-white hover:text-cyan-300 transition-colors">{item.title}</h4>
                        </div>
                        <span className="px-2.5 py-1 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-700 text-xs font-mono font-bold">
                          95% Match
                        </span>
                      </div>

                      <p className="text-xs text-slate-300 line-clamp-3 leading-relaxed">{item.snippet}</p>

                      <div className="pt-2 border-t border-slate-800/80 flex items-center justify-between">
                        <span className="text-[11px] text-slate-500 font-mono">Published: {item.published_date || 'Recent'}</span>
                        <a
                          href={item.url}
                          target="_blank"
                          rel="noreferrer"
                          className="px-3.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs transition-all"
                        >
                          Apply / Open Link ↗
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
            <p>Curly LLM Web Search API Tester • GlobalHunt AI Playground</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CurlySearchApp />);
  </script>
</body>
</html>
