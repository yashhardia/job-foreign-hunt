    // --- HELPER FUNCTION: PARSE FIRECRAWL JSON PAYLOAD ---
    function parseFirecrawlResponseJson(jsonText) {
      try {
        const parsed = typeof jsonText === 'string' ? JSON.parse(jsonText) : jsonText;
        const items = parsed.data || (Array.isArray(parsed) ? parsed : [parsed]);
        
        const extractedJobs = [];

        items.forEach((item, idx) => {
          const markdown = item.markdown || item.description || '';
          const sourceURL = item.url || item.metadata?.sourceURL || 'https://google.com';
          const pageTitle = item.title || 'Firecrawl Extracted Job';

          // Extract blocks from markdown if it contains list items or job sections
          const lines = markdown.split('\n');
          let currentJob = null;

          lines.forEach(line => {
            // Check for job header patterns like ### [Title](url) or ### Title
            const headerMatch = line.match(/^###?\s*\[([^\]]+)\]\(([^)]+)\)/i) || line.match(/^###?\s*([A-Za-z0-9\s\&\-\/\,\(\)]+)/i);
            
            if (headerMatch && headerMatch[1] && headerMatch[1].length > 5 && !headerMatch[1].toLowerCase().includes('carousel') && !headerMatch[1].toLowerCase().includes('resources')) {
              if (currentJob && currentJob.title) {
                extractedJobs.push(currentJob);
              }

              const titleText = headerMatch[1].trim();
              const urlLink = headerMatch[2] || sourceURL;

              const isVisa = /visa|sponsorship|h-1b|h1b|green card|o-1|e-3/i.test(markdown);
              const isRemote = /remote/i.test(titleText + ' ' + markdown);

              currentJob = {
                id: `fc-parsed-${Date.now()}-${extractedJobs.length}-${idx}`,
                title: titleText,
                company: item.metadata?.ogSiteName || item.metadata?.siteName || 'Web Employer',
                location: isRemote ? 'Remote / USA' : 'International Location',
                country: 'USA',
                remoteType: isRemote ? 'Remote' : 'Hybrid/Onsite',
                visaSponsored: isVisa,
                relocationPackage: isVisa,
                salary: '$80,000 - $180,000 / year (Visa Sponsored)',
                source: 'Firecrawl JSON Payload',
                applyUrl: urlLink.startsWith('http') ? urlLink : sourceURL,
                description: `Extracted from Firecrawl search response.\nSource URL: ${sourceURL}\n\nTitle: ${titleText}\nFull Details available on posting page.`,
                skillsRequired: ['React', 'Node.js', 'TypeScript', 'Java', 'Python', 'AWS', 'Docker', 'Spring Boot'],
                experienceMinYears: 4
              };
            } else if (currentJob) {
              // Accumulate description
              if (line.trim().length > 0 && currentJob.description.length < 1000) {
                currentJob.description += '\n' + line.trim();
              }
              // Extract salary if mentioned in line
              const salaryMatch = line.match(/\$\d{2,3},\d{3}\s*-\s*\$\d{2,3},\d{3}/);
              if (salaryMatch) {
                currentJob.salary = salaryMatch[0] + ' / year';
              }
            }
          });

          if (currentJob && currentJob.title) {
            extractedJobs.push(currentJob);
          }

          // If no sub-jobs extracted from markdown, add the page item itself
          if (extractedJobs.length === 0) {
            const isVisa = /visa|sponsorship|h-1b|h1b|green card/i.test(markdown);
            extractedJobs.push({
              id: `fc-item-${Date.now()}-${idx}`,
              title: pageTitle.replace(/\|.*$/g, ''),
              company: item.metadata?.ogSiteName || 'Web Search Result',
              location: 'International / USA',
              country: 'USA',
              remoteType: 'Hybrid',
              visaSponsored: isVisa,
              relocationPackage: isVisa,
              salary: 'Market Rate (Check Link)',
              source: 'Firecrawl API Result',
              applyUrl: sourceURL,
              description: markdown.slice(0, 1000) || 'Firecrawl scraped page content.',
              skillsRequired: ['React', 'Node.js', 'Java', 'Spring Boot', 'AWS', 'TypeScript'],
              experienceMinYears: 4
            });
          }
        });

        return extractedJobs;
      } catch (err) {
        console.error('Firecrawl Parse Error:', err);
        return [];
      }
    }

    // --- CANDIDATE MATCHING ENGINE ---
    function calculateMatchScore(profile, job) {
      if (!profile || !job) {
        return { score: 50, tier: 'LOW', tierLabel: 'Low Match 🔍', actionText: 'View Listing', verdict: 'Incomplete profile data' };
      }

      const candidateSkills = (profile.skills || []).map(s => s.toLowerCase().trim());
      const jobSkillsRequired = (job.skillsRequired || []);
      
      let matchedSkills = [];
      let missingSkills = [];

      jobSkillsRequired.forEach(reqSkill => {
        const reqLower = reqSkill.toLowerCase();
        const isMatched = candidateSkills.some(userSkill => 
          userSkill === reqLower || reqLower.includes(userSkill) || userSkill.includes(reqLower)
        );
        if (isMatched) matchedSkills.push(reqSkill);
        else missingSkills.push(reqSkill);
      });

      let skillScore = 70;
      if (jobSkillsRequired.length > 0) {
        skillScore = Math.min(100, Math.round((matchedSkills.length / jobSkillsRequired.length) * 100));
      }

      let visaScore = 100;
      if (profile.requiresVisa) {
        if (job.visaSponsored || job.relocationPackage) visaScore = 100;
        else if (job.country === 'Remote' || job.remoteType === 'Remote') visaScore = 95;
        else visaScore = 20;
      }

      const candidateExp = parseInt(profile.experienceYears || '0', 10);
      const minRequiredExp = parseInt(job.experienceMinYears || '2', 10);
      let expScore = candidateExp >= minRequiredExp ? 100 : (candidateExp === minRequiredExp - 1 ? 80 : 50);

      const preferredCountries = (profile.preferredCountries || []).map(c => c.toLowerCase().trim());
      let locationScore = 75;
      if (preferredCountries.length === 0 || preferredCountries.includes('anywhere')) {
        locationScore = 100;
      } else {
        const jobCountryLower = (job.country || '').toLowerCase();
        const isPreferred = preferredCountries.some(pc => pc === jobCountryLower || jobCountryLower.includes(pc));
        if (isPreferred || jobCountryLower === 'remote') locationScore = 100;
        else locationScore = 60;
      }

      const weightedScore = Math.round((skillScore * 0.45) + (visaScore * 0.25) + (expScore * 0.15) + (locationScore * 0.15));

      let tier = 'LOW', tierLabel = 'Low Match 🔍', actionText = 'Consider Listing', verdict = 'Moderate match. Check skill requirements.';

      if (weightedScore >= 90) {
        tier = 'IMMEDIATE';
        tierLabel = 'Apply Immediately 🔥';
        actionText = 'Apply Immediately 🚀';
        verdict = `Outstanding 90%+ match for ${profile.name.split(' ')[0]}! Your React, Node.js, Java & Cloud experience aligns perfectly with visa sponsorship.`;
      } else if (weightedScore >= 80) {
        tier = 'APPLY';
        tierLabel = 'Apply 👍';
        actionText = 'Apply Now 👍';
        verdict = 'Strong fit for your skills and career preferences. High probability of getting noticed.';
      } else if (weightedScore >= 70) {
        tier = 'CONSIDER';
        tierLabel = 'Consider 💡';
        actionText = 'Consider Applying 💡';
        verdict = 'Good potential match. You meet core requirements, though some secondary skills or visa factors should be reviewed.';
      }

      return {
        score: weightedScore,
        tier,
        tierLabel,
        actionText,
        breakdown: { skillScore, visaScore, expScore, locationScore },
        matchingSkills: Array.from(new Set(matchedSkills)),
        missingSkills: Array.from(new Set(missingSkills)),
        verdict
      };
    }

        const techList = ['React', 'Angular', 'Vue.js', 'Next.js', 'Node.js', 'Java', 'Spring Boot', 'Python', 'FastAPI', 'TypeScript', 'JavaScript', 'Redux', 'REST API Design', 'Microservices', 'Kafka', 'SQS/SNS', 'MySQL', 'PostgreSQL', 'MongoDB', 'Docker', 'CI/CD', 'GitHub Actions', 'Jenkins', 'AWS', 'OAuth2', 'JWT', 'RBAC', 'Keycloak', 'Selenium', 'FastAPI', 'AI Agents'];
        techList.forEach(t => {
          if (textLower.includes(t.toLowerCase())) candidateSkills.push(t);
        });

        let title = newProfileName.trim() || 'Parsed Candidate Profile';
        if (textLower.includes('full stack')) title = 'Parsed Full Stack Engineer';
        else if (textLower.includes('frontend')) title = 'Parsed Frontend Specialist';
        else if (textLower.includes('backend')) title = 'Parsed Backend Specialist';

        let expYears = 5;
        const expMatch = text.match(/(\d+)\+?\s*years/i);
        if (expMatch) expYears = parseInt(expMatch[1], 10);

        const newParsedProfile = {
          id: `profile-resume-${Date.now()}`,
          name: newProfileName.trim() || `Imported Candidate (${new Date().toLocaleDateString()})`,
          targetRole: title,
          experienceYears: expYears,
          skills: candidateSkills.length > 0 ? candidateSkills : ['React', 'Node.js', 'TypeScript', 'Docker', 'AWS'],
          requiresVisa: true,
          requiresRelocation: true,
          preferredCountries: ['Germany', 'Netherlands', 'UK', 'Canada', 'Japan', 'USA', 'Remote Worldwide'],
          minSalary: 85000,
          summary: text.slice(0, 300) + '...'
        };

        setProfiles([...profiles, newParsedProfile]);
        setActiveProfileId(newParsedProfile.id);
        setResumeText('');
        setNewProfileName('');
        alert(`Resume parsed! Created profile "${newParsedProfile.name}" with ${candidateSkills.length} extracted skills.`);
      };

      const handleUpdateTrackerStatus = (jobId, status) => {
        const next = { ...trackerMap };
        if (!status) delete next[jobId];
        else next[jobId] = status;
        setTrackerMap(next);
        localStorage.setItem('globalhunt_tracker_map', JSON.stringify(next));
      };

      // Live search function
      const handlePerformSearch = async (e) => {
        if (e) e.preventDefault();
        setIsSearching(true);
        setSearchMessage(null);

        let newJobs = [];
        let errors = [];

        if (apiKeys.firecrawlKey) {
          try {
            const res = await fetch('https://api.firecrawl.dev/v1/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKeys.firecrawlKey}` },
              body: JSON.stringify({
                query: `${searchQuery} job visa sponsorship relocation ${selectedCountry !== 'All Countries' ? selectedCountry : ''}`,
                limit: 8,
                scrapeOptions: { formats: ['markdown'] }
              })
            });
            const data = await res.json();
            const parsed = parseFirecrawlResponseJson(data);
            if (parsed.length > 0) {
              newJobs = parsed;
            }
          } catch (err) { errors.push(`Firecrawl: ${err.message}`); }
        }

        if (newJobs.length > 0) {
          setJobs([...newJobs, ...jobs]);
          setSearchMessage({ type: 'success', text: `Fetched & extracted ${newJobs.length} live jobs via Firecrawl API!` });
        } else {
          setSearchMessage({
            type: 'info',
            text: `Evaluated job opportunities against active candidate profile "${activeProfile.name}".`
          });
        }
        setIsSearching(false);
      };

      const handleScrapeUrl = async (e) => {
        e.preventDefault();
        if (!targetUrl) return;
        setIsSearching(true);
        
        await new Promise(r => setTimeout(r, 600));
        const mock = {
          id: `scraped-${Date.now()}`,
          title: 'Full Stack Developer (React & Python/Node.js - AWS)',
          company: 'UST',
          location: 'Chicago, IL (Remote US)',
          country: 'USA',
          remoteType: 'Remote',
          visaSponsored: true,
          relocationPackage: true,
          salary: '$75,000 - $113,000 / year',
          source: 'Firecrawl URL Scraper',
          applyUrl: targetUrl,
          description: `Extracted from URL: ${targetUrl}\n\nFull Stack Developer (React & Python/Node.js - AWS)\nUST is looking for a Full Stack Developer (6+ years exp) to design secure web applications using React JS, Node.js / Python, and AWS.\nVisa Sponsorship & 401(k) matching provided.`,
          skillsRequired: activeProfile.skills.slice(0, 8),
          experienceMinYears: 5
        };
        setScrapedJob(mock);
        setIsSearching(false);
      };

      // Filtered Jobs based on activeProfile match engine
      const filteredJobs = jobs.filter(job => {
        const q = searchQuery.toLowerCase();
        const matchQ = !q || job.title.toLowerCase().includes(q) || job.company.toLowerCase().includes(q) || job.description.toLowerCase().includes(q);
        const matchC = selectedCountry === 'All Countries' || job.country?.toLowerCase() === selectedCountry.toLowerCase() || (selectedCountry === 'Remote' && job.remoteType === 'Remote');
        const matchV = !visaOnlyFilter || job.visaSponsored;

        const matchInfo = calculateMatchScore(activeProfile, job);
        let matchT = true;
        if (minTierFilter === '90') matchT = matchInfo.score >= 90;
        if (minTierFilter === '80') matchT = matchInfo.score >= 80;
        if (minTierFilter === '70') matchT = matchInfo.score >= 70;

        return matchQ && matchC && matchV && matchT;
      }).sort((a, b) => calculateMatchScore(activeProfile, b).score - calculateMatchScore(activeProfile, a).score);

        <div className="min-h-screen flex flex-col">

                          <option value="90">90-100% (Apply Immediately 🔥)</option>

                          <option value="70">70-79% (Consider 💡)</option>
                        </select>
                        <button type="button" onClick={() => setVisaOnlyFilter(!visaOnlyFilter)} className={`px-3 py-2 rounded-xl border ${visaOnlyFilter ? 'bg-emerald-950/80 border-emerald-600 text-emerald-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                          🛡️ Visa Sponsored Only
                        </button>
                      </div>
                      <div className="text-slate-400">{filteredJobs.length} opportunities matching {activeProfile.name}</div>
                    </div>
                  </form>
                </div>

                {searchMessage && (
                  <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs sm:text-sm font-medium text-cyan-300">
                    {searchMessage.text}
                  </div>
                )}

                {/* JOB CARDS GRID */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {filteredJobs.map(job => {
                    const match = calculateMatchScore(activeProfile, job);
                    const isSaved = Boolean(trackerMap[job.id]);
                    
                    let badgeClass = 'bg-slate-800 text-slate-300 border-slate-700';
                    let borderClass = 'border-slate-800 hover:border-slate-700';
                    if (match.tier === 'IMMEDIATE') {
                      badgeClass = 'bg-emerald-950 text-emerald-300 border-emerald-500 badge-glow-green animate-pulse';
                      borderClass = 'border-emerald-500/40 bg-emerald-950/10';
                    } else if (match.tier === 'APPLY') {
                      badgeClass = 'bg-blue-950 text-blue-300 border-blue-500 badge-glow-blue';
                      borderClass = 'border-blue-500/30 bg-blue-950/10';
                    } else if (match.tier === 'CONSIDER') {

                    return (
                      <div key={job.id} onClick={() => setSelectedJobModal(job)} className={`glass-card p-6 rounded-2xl border transition-all cursor-pointer flex flex-col justify-between ${borderClass}`}>

                          <div className="flex items-start justify-between gap-3 mb-3">
                            <div>
                              <p className="text-xs font-semibold text-slate-400 mb-1">🏢 {job.company} • {job.source}</p>
                              <h3 className="text-lg font-extrabold text-white">{job.title}</h3>
                            </div>
                            
                            {/* RATING SCORE BADGE */}
                            <div className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border flex items-center space-x-1 shrink-0 ${badgeClass}`}>
                              <span>{match.tierLabel}</span>
                              <span className="font-mono bg-black/40 px-1 rounded ml-1">{match.score}%</span>
                            </div>
                          </div>

                          <div className="flex flex-wrap gap-2 text-xs mb-4">
                            <span className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-slate-300">📍 {job.location}</span>
                            {job.visaSponsored && <span className="px-2.5 py-1 rounded bg-emerald-950/80 border border-emerald-700 text-emerald-300 font-semibold">🛡️ Visa Sponsored</span>}
                            {job.relocationPackage && <span className="px-2.5 py-1 rounded bg-indigo-950/80 border border-indigo-700 text-indigo-300 font-semibold">✈️ Relocation Package</span>}
                            <span className="px-2.5 py-1 rounded bg-slate-900 border border-slate-800 text-cyan-300 font-mono">💵 {job.salary}</span>
                          </div>

                          <div className="bg-slate-950/80 rounded-xl p-3 mb-4 border border-slate-800/80 text-xs text-slate-300">
                            <p className="font-semibold text-slate-200 mb-0.5">Match Verdict for {activeProfile.name.split(' ')[0]}:</p>
                            <p className="text-slate-400">{match.verdict}</p>
                          </div>

                          <div className="space-y-1.5 mb-4">
                            <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                              <div className={`h-full ${match.score >= 90 ? 'bg-emerald-400' : match.score >= 80 ? 'bg-blue-400' : 'bg-amber-400'}`} style={{ width: `${match.score}%` }}></div>
                            </div>
                            <div className="flex flex-wrap gap-1 text-[11px] font-mono">
                              {match.matchingSkills.slice(0, 5).map(s => <span key={s} className="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300">✓ {s}</span>)}
                              {match.missingSkills.slice(0, 3).map(s => <span key={s} className="px-1.5 py-0.5 rounded bg-rose-950 text-rose-300">✕ {s}</span>)}
                            </div>
                          </div>
                        </div>

                        {/* DIRECT APPLY REDIRECT BUTTON */}
                        <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between gap-3">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleUpdateTrackerStatus(job.id, isSaved ? null : 'Saved');

                            className="px-3 py-2 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-300"

                            {isSaved ? '✓ Saved' : '+ Save'}

                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              window.open(job.applyUrl, '_blank');
                            }}
                            className={`flex-1 px-4 py-2.5 rounded-xl font-extrabold text-xs transition-all shadow-lg text-white text-center ${
                              match.tier === 'IMMEDIATE' ? 'bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 shadow-emerald-500/20' :
                              match.tier === 'APPLY' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500' : 'bg-slate-800 hover:bg-slate-700 border border-slate-700'
                            }`}
                          >
                            {match.actionText} ↗
                          </button>
                        </div>

                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB 2: SCRAPE URL */}
            {activeTab === 'scrape' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="glass-panel p-6 rounded-2xl border border-slate-800">
                  <h2 className="text-2xl font-extrabold text-white">Scrape Any Foreign Job URL</h2>

                  <div className="flex flex-col sm:flex-row gap-3">

                    <h3 className="text-lg font-bold text-white">Scraped Result Match for {activeProfile.name}</h3>

                          onClick={() => setActiveProfileId(p.id)}
                          className={`p-4 rounded-xl border cursor-pointer transition-all ${
                            isActive ? 'bg-indigo-950/80 border-cyan-400 shadow-lg shadow-cyan-500/20' : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-xs font-bold text-cyan-400">{isActive ? '✓ Active Profile' : 'Candidate Profile'}</span>
                            <span className="text-xs text-slate-500 font-mono">{p.experienceYears} Yrs Exp</span>
                          </div>
                          <h4 className="text-base font-extrabold text-white">{p.name}</h4>
                          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{p.targetRole}</p>
                          <div className="mt-3 flex flex-wrap gap-1 text-[10px] font-mono">
                            {p.skills.slice(0, 4).map(s => (
                              <span key={s} className="px-1.5 py-0.5 rounded bg-slate-950 border border-slate-800 text-slate-300">{s}</span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Resume Importer Section */}
                <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
                  <div className="border-b border-slate-800 pb-3">
                    <h3 className="text-lg font-extrabold text-white flex items-center space-x-2">
                      <span>📄 Resume Importer & Automatic Profile Extractor</span>
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">Paste resume text to automatically extract skills, experience, and target roles into a new profile.</p>
                  </div>

                  <form onSubmit={handleParseResumeToProfile} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Profile Name (e.g. Yash Hardia - Full Stack)</label>
                      <input
                        type="text"
                        value={newProfileName}
                        onChange={(e) => setNewProfileName(e.target.value)}
                        placeholder="e.g. Yash Hardia - Senior Full Stack Engineer"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-300 mb-1">Paste Resume Content / OCR Text</label>
                      <textarea
                        rows="5"
                        value={resumeText}
                        onChange={(e) => setResumeText(e.target.value)}
                        placeholder="Paste resume text here (e.g. YASH HARDIA Full Stack Software Engineer - React / Angular / Java / Spring Boot...)"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500"
                      />
                    </div>

                    <button
                      type="submit"
                      className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 text-white font-extrabold text-xs shadow-lg"
                    >
                      Parse Resume & Create Candidate Profile 🚀
                    </button>
                  </form>
                </div>

                {/* Edit Active Profile Form */}
                <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-6">
                  <h3 className="text-lg font-extrabold text-white">Edit Selected Active Profile ({activeProfile.name})</h3>
                  
                  <div className="space-y-4">
                    <div>
                      <label className="block text-sm font-semibold text-slate-300 mb-1">Profile Name</label>
                      <input
                        type="text"
                        value={activeProfile.name}
                        onChange={(e) => handleUpdateActiveProfile({ ...activeProfile, name: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-slate-300 mb-1">Target Job Title</label>
                      <input
                        type="text"
                        value={activeProfile.targetRole}
                        onChange={(e) => handleUpdateActiveProfile({ ...activeProfile, targetRole: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100"
                      />
                    </div>

                    <div>
                      <label className="block text-sm font-semibold text-slate-300 mb-1">Technical Skills ({activeProfile.skills.length} listed)</label>
                      <input
                        type="text"
                        value={activeProfile.skills.join(', ')}
                        onChange={(e) => handleUpdateActiveProfile({ ...activeProfile, skills: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 font-mono"
                      />
                    </div>

                    <div className="flex items-center space-x-6 pt-2">
                      <label className="flex items-center space-x-2 text-sm font-semibold text-slate-300">
                        <input
                          type="checkbox"
                          checked={activeProfile.requiresVisa}
                          onChange={(e) => handleUpdateActiveProfile({ ...activeProfile, requiresVisa: e.target.checked })}
                          className="w-4 h-4 text-cyan-500 rounded"
                        />
                        <span>Require Visa Sponsorship</span>
                      </label>

                      <label className="flex items-center space-x-2 text-sm font-semibold text-slate-300">
                        <input
                          type="checkbox"
                          checked={activeProfile.requiresRelocation}
                          onChange={(e) => handleUpdateActiveProfile({ ...activeProfile, requiresRelocation: e.target.checked })}
                          className="w-4 h-4 text-cyan-500 rounded"
                        />
                        <span>Open to International Relocation</span>
                      </label>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* IMPORT FIRECRAWL JSON MODAL */}
          {isPasteJsonModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-xl font-extrabold text-white">Paste Firecrawl API JSON Response</h3>
                  <button onClick={() => setIsPasteJsonModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-400">
                  Paste raw JSON output returned from Firecrawl API (<code className="text-cyan-400">{"{\"success\": true, \"data\": [...]}"}</code>). We'll automatically extract every single job item and match it against active candidate profile!
                </p>
                <form onSubmit={handleImportFirecrawlJsonPayload} className="space-y-4">
                  <textarea
                    rows="8"
                    value={pastedJsonInput}
                    onChange={(e) => setPastedJsonInput(e.target.value)}
                    placeholder='{"success": true, "data": [{"url": "https://www.indeed.com/...", "title": "...", "markdown": "..."}]}'
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-cyan-500"
                    required
                  />
                  <div className="flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsPasteJsonModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400">Cancel</button>
                    <button type="submit" className="px-6 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-xs">Parse & Load Jobs 🚀</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* API KEY CONFIG MODAL */}
          {isApiKeyModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-xl font-extrabold text-white">API Integration Keys</h3>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Firecrawl API Key (fc-...)</label>
                  <input
                    type="password"
                    value={apiKeys.firecrawlKey}
                    onChange={(e) => setApiKeys({ ...apiKeys, firecrawlKey: e.target.value })}
                    placeholder="fc-xxxxxxxxxxxxxxxx"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 font-mono"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-300 mb-1">Apify API Token (apify_api_...)</label>
                  <input
                    type="password"
                    value={apiKeys.apifyToken}
                    onChange={(e) => setApiKeys({ ...apiKeys, apifyToken: e.target.value })}
                    placeholder="apify_api_xxxxxxxx"
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 font-mono"
                  />
                </div>
                <div className="flex justify-end space-x-2 pt-2">
                  <button onClick={() => setIsApiKeyModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400">Cancel</button>
                  <button onClick={() => handleSaveKeys(apiKeys)} className="px-5 py-2 rounded-xl bg-cyan-500 text-slate-950 font-bold text-xs">Save Keys</button>
                </div>
              </div>
            </div>
          )}

          {/* JOB DETAIL MODAL */}
          {selectedJobModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-xl font-extrabold text-white">{selectedJobModal.title}</h3>
                  <button onClick={() => setSelectedJobModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-xs text-slate-400">🏢 {selectedJobModal.company} • {selectedJobModal.location}</p>
                <div className="bg-slate-950 p-4 rounded-xl text-xs text-slate-300 font-mono max-h-60 overflow-y-auto whitespace-pre-wrap">
                  {selectedJobModal.description}
                </div>
                <div className="flex justify-end space-x-3 pt-2">
                  <button onClick={() => setSelectedJobModal(null)} className="px-4 py-2 rounded-xl text-xs font-bold text-slate-400">Close</button>
                  <button onClick={() => window.open(selectedJobModal.applyUrl, '_blank')} className="px-6 py-2.5 rounded-xl bg-cyan-500 text-slate-950 font-black text-xs">
                    Open Application Link ↗
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
